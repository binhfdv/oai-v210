xchain-gui-server:
  enabled: true
  image:
    repository: ddocker122/xchain-gui-server
    tag: latest
  fullnameOverride: "xchain-gui-server"
  nodeSelector:
    node-role: core
  env:
    BASE_DIR:                   /results/
    REFRESH_INTERVAL:           "2"
    SOCKET_PORT:                "4000"
    TRAFFIC_SERVER_HOSTNAME:    oai-traffic-server
    TRAFFIC_SERVER_CMD_VR:      "start:bash -c 'cd /traffic-gen && ./replay_pcap.sh pcap/demo/vr.pcap'"
    TRAFFIC_SERVER_CMD_HAPTIC:  "start:bash -c 'cd /traffic-gen && ./replay_pcap.sh pcap/demo/haptic.pcap'"
    TRAFFIC_SERVER_CMD_SOCIAL:  "start:bash -c 'cd /traffic-gen && ./replay_pcap.sh pcap/demo/social.pcap'"
    TRAFFIC_SERVER_CMD_IOT:     "start:bash -c 'cd /traffic-gen && ./replay_pcap.sh pcap/demo/iot.pcap'"
    SMARTGW_HOSTNAME:           xchain-smartgw-demo
    SMARTGW_CMD_MODELS:         "start:{models}"
    MODELS_CONFIG: '[{"value":"gnn","label":"FastInfer-1","color":"#dd2d4a","backgroundColor":"","icon":"/assets/images/icons/fastinf.png","css_class":"gnn-card","isSelected":false},{"value":"lstm","label":"CNN-1","color":"#33658a","backgroundColor":"","icon":"/assets/images/icons/cnn.png","css_class":"lstm-card","isSelected":false},{"value":"fastinfer","label":"FastInfer-2","color":"#76c893","backgroundColor":"#ecfdf5","icon":"/assets/images/icons/fastinf.png","css_class":"fastinfer-card","isSelected":true},{"value":"cnn","label":"CNN-2","color":"#fb8500","backgroundColor":"#ffb703","icon":"/assets/images/icons/cnn.png","css_class":"cnn-card","isSelected":true}]'

  # Shared results PVC — type: nfs (distributed) or hostPath (single-node)
  persistentVolume:
    enabled: true
    name: demo-results-pv
    claimName: demo-results-pvc
    mountPath: /results
    type: nfs
    nfs:
      server: 192.168.21.153
      path: /home/core/oai-v210/xChain/src/2026-netsoft-demo/api/server/demo/data
    hostPath: /home/core/oai-v210/xChain/src/2026-netsoft-demo/api/server/demo/data

tractor-kpm-oai:
  enabled: true
  fullnameOverride: "tractor-kpm-oai"
  nodeSelector:
    node-role: ran
  image:
    tag: latest
  env:
    ORCH_HOST: xchain-smartgw-demo
    ORCH_PORT: "4200"
    RESULTS_DIR: /results
  resultsPVC:
    claimName: demo-results-pvc
    mountPath: /results

xchain-smartgw-demo:
  enabled: true
  fullnameOverride: "xchain-smartgw-demo"
  nodeSelector:
    node-role: ran
  image:
    repository: ddocker122/xchain-smartgw-demo
    tag: latest
  persistentVolume:
    hostPath: /home/ran/oai-v210/xChain/src/smartGW
  env:
    MODELS: "fastinfer,cnn,lstm,gnn"
    MODEL_FASTINFER_HOST: xchain-fastinfer
    MODEL_FASTINFER_PORT: "4400"
    MODEL_CNN_HOST: tractor-mono
    MODEL_CNN_PORT: "4300"
    MODEL_LSTM_HOST: xchain-lstm
    MODEL_LSTM_PORT: "4600"
    MODEL_GNN_HOST: xchain-gnn
    MODEL_GNN_PORT: "4500"
  # Universal agent sidecar (AGENT_MODE=file)
  agent:
    enabled: true
    image:
      repository: ddocker122/universal-agent
      tag: latest
      pullPolicy: IfNotPresent
    env:
      DEMO_SERVER_HOST: xchain-gui-server
      DEMO_SERVER_PORT: "4000"
      AGENT_MODE: file
      AGENT_HOSTNAME: xchain-smartgw-demo
      AGENT_OUTPUT_FILE: /tmp/selected_models.txt

xchain-fastinfer:
  enabled: true
  fullnameOverride: "xchain-fastinfer"
  nodeSelector:
    node-role: pi
  image:
    tag: latest
  persistentVolume:
    hostPath: /home/pi/oai-v210/xChain/src/xapp-fastinfer
    subPath: xgb_model_T_4.json
  env:
    T: "4"
  # Universal agent sidecar (log_collector mode)
  agent:
    enabled: true
    image:
      repository: ddocker122/universal-agent
      tag: latest
      pullPolicy: IfNotPresent
    env:
      DEMO_SERVER_HOST: xchain-gui-server
      DEMO_SERVER_PORT: "4000"
      AGENT_MODE: log_collector
      MODEL_NAME: fastinfer
      MODEL_TYPE: xgboost
      LOG_FILE: /model-logs/model.log
      RESULTS_DIR: /results
  # Shared results PVC (NFS)
  resultsPVC:
    claimName: demo-results-pvc
    mountPath: /results

tractor-mono:
  enabled: true
  fullnameOverride: "tractor-mono"
  nodeSelector:
    node-role: pi
  image:
    tag: latest
  persistentVolume:
    model:
      hostPath: /home/pi/oai-v210/tractor/src/xapp/models
    norm:
      hostPath: /home/pi/oai-v210/tractor/src/xapp/models
  env:
    T: "4"
  volumeMounts:
    model:
      subPath: model.4.cnn.pt
  # Shared results PVC (NFS)
  resultsPVC:
    claimName: demo-results-pvc
    mountPath: /results
  # Universal agent sidecar (log_collector mode)
  agent:
    enabled: true
    image:
      repository: ddocker122/universal-agent
      tag: latest
      pullPolicy: IfNotPresent
    env:
      DEMO_SERVER_HOST: xchain-gui-server
      DEMO_SERVER_PORT: "4000"
      AGENT_MODE: log_collector
      MODEL_NAME: cnn
      MODEL_TYPE: cnn
      LOG_FILE: /model-logs/model.log
      RESULTS_DIR: /results

