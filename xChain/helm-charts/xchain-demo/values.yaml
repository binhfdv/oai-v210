xchain-gui-server:
  enabled: true
  image:
    repository: ddocker122/xchain-gui-server
    tag: latest
  fullnameOverride: "xchain-gui-server"
  nodeSelector:
    node-role: core
  env:
    BASE_DIR:                   /results/
    REFRESH_INTERVAL:           "2"
    SOCKET_PORT:                "4000"
    TRAFFIC_SERVER_HOSTNAME:    oai-traffic-server
    TRAFFIC_SERVER_CMD_VR:      "start:bash -c 'cd /traffic-gen && ./replay_pcap.sh pcap/demo/vr.pcap'"
    TRAFFIC_SERVER_CMD_HAPTIC:  "start:bash -c 'cd /traffic-gen && ./replay_pcap.sh pcap/demo/haptic.pcap'"
    TRAFFIC_SERVER_CMD_SOCIAL:  "start:bash -c 'cd /traffic-gen && ./replay_pcap.sh pcap/demo/social.pcap'"
    TRAFFIC_SERVER_CMD_IOT:     "start:bash -c 'cd /traffic-gen && ./replay_pcap.sh pcap/demo/iot.pcap'"
    SMARTGW_HOSTNAME:           xchain-smartgw-demo
    SMARTGW_CMD_MODELS:         "start:{models}"
    MODELS_CONFIG: '[{"value":"fastinferv1","label":"FastInfer-v1","foregroundColor":"#dd2d4a","backgroundColor":"","icon":"/assets/images/icons/fastinf.png","css_class":"fastinfer-card","isSelected":false},{"value":"cnnv1","label":"CNN-v1","foregroundColor":"#33658a","backgroundColor":"","icon":"/assets/images/icons/cnn.png","css_class":"cnn-card","isSelected":false},{"value":"fastinferv2","label":"FastInfer-v2","foregroundColor":"#9b1f34","backgroundColor":"","icon":"/assets/images/icons/fastinf.png","css_class":"fastinfer-card","isSelected":true},{"value":"cnnv2","label":"CNN-v2","foregroundColor":"#244761","backgroundColor":"","icon":"/assets/images/icons/cnn.png","css_class":"cnn-card","isSelected":true}]'

  # Shared results PVC — type: nfs (distributed) or hostPath (single-node)
  persistentVolume:
    enabled: true
    name: demo-results-pv
    claimName: demo-results-pvc
    mountPath: /results
    type: nfs
    nfs:
      server: 192.168.21.153
      path: /home/core/oai-v210/xChain/src/2026-netsoft-demo/api/server/demo/data
    hostPath: /home/core/oai-v210/xChain/src/2026-netsoft-demo/api/server/demo/data

tractor-kpm-oai:
  enabled: true
  fullnameOverride: "tractor-kpm-oai"
  nodeSelector:
    node-role: ran
  image:
    tag: latest
  env:
    ORCH_HOST: xchain-smartgw-demo
    ORCH_PORT: "4200"
    RESULTS_DIR: /results
  resultsPVC:
    claimName: demo-results-pvc
    mountPath: /results

xchain-smartgw-demo:
  enabled: true
  fullnameOverride: "xchain-smartgw-demo"
  nodeSelector:
    node-role: ran
  image:
    repository: ddocker122/xchain-smartgw-demo
    tag: latest
  persistentVolume:
    hostPath: /home/ran/oai-v210/xChain/src/smartGW
  env:
    MODELS: "fastinferv1,fastinferv2,cnnv1,cnnv2"
    MODEL_FASTINFERV1_HOST: xchain-fastinfer-v1
    MODEL_FASTINFERV1_PORT: "4400"
    MODEL_FASTINFERV2_HOST: xchain-fastinfer-v2
    MODEL_FASTINFERV2_PORT: "4400"
    MODEL_CNNV1_HOST: tractor-mono-v1
    MODEL_CNNV1_PORT: "4300"
    MODEL_CNNV2_HOST: tractor-mono-v2
    MODEL_CNNV2_PORT: "4300"
  # Universal agent sidecar (AGENT_MODE=file)
  agent:
    enabled: true
    image:
      repository: ddocker122/universal-agent
      tag: latest
      pullPolicy: IfNotPresent
    env:
      DEMO_SERVER_HOST: xchain-gui-server
      DEMO_SERVER_PORT: "4000"
      AGENT_MODE: file
      AGENT_HOSTNAME: xchain-smartgw-demo
      AGENT_OUTPUT_FILE: /tmp/selected_models.txt

xchain-fastinfer-v1:
  enabled: true
  fullnameOverride: "xchain-fastinfer-v1"
  nodeSelector:
    node-role: pi
  image:
    tag: latest
  serviceAccount:
    create: true
    name: "xchain-fastinfer-v1-sa"
    automount: true
    annotations: {}
  persistentVolume:
    enabled: true
    name: xchain-fastinfer-v1-pv
    claimName: xchain-fastinfer-v1-pvc
    size: 1Gi
    accessMode: ReadWriteMany
    reclaimPolicy: Delete
    hostPath: /home/pi/oai-v210/xChain/src/xapp-fastinfer
    subPath: xgb_model_T_4.json
  env:
    T: "4"
  # Universal agent sidecar (log_collector mode)
  agent:
    enabled: true
    image:
      repository: ddocker122/universal-agent
      tag: latest
      pullPolicy: IfNotPresent
    env:
      DEMO_SERVER_HOST: xchain-gui-server
      DEMO_SERVER_PORT: "4000"
      AGENT_MODE: log_collector
      MODEL_NAME: fastinferv1
      MODEL_TYPE: xgboost
      LOG_FILE: /model-logs/model.log
      RESULTS_DIR: /results
  # Shared results PVC (NFS)
  resultsPVC:
    claimName: demo-results-pvc
    mountPath: /results

