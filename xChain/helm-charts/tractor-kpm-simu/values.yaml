replicaCount: 1

image:
  pullPolicy: IfNotPresent
  repository: ddocker122/tractor-kpm-simu
  tag: latest

fullnameOverride: "tractor-kpm-simu"

env:
  ORCH_HOST: tractor-orchestrator
  ORCH_PORT: '4200'

service:
  port: 4200
  type: ClusterIP

serviceAccount:
  annotations: {}
  automount: true
  create: true
  name: ''

volumeMounts:
  kpisCsv:
    mountPath: /app/kpis.csv
    subPath: embb_1010123456010_metrics.csv

persistentVolume:
  enabled: true
  name: tractor-kpm-simu-pv
  claimName: tractor-kpm-simu-pvc
  size: 1Gi
  accessMode: ReadWriteMany
  hostPath: /home/lapdk/workspace/oai-v210/xChain/src/kpm-sim
  reclaimPolicy: Delete

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
