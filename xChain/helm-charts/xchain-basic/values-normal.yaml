tractor-kpm-oai:
  enabled: true
  fullnameOverride: "tractor-kpm-oai"
  nodeSelector:
    node-role: core
  image:
    tag: latest
  env:
    ORCH_HOST: xchain-smartgw
    ORCH_PORT: "4200"
    # NUM_UES: "5"

tractor-kpm-simu:
  enabled: false
  fullnameOverride: "tractor-kpm-simu"
  nodeSelector:
    node-role: core
  image:
    tag: latest
  env:
    ORCH_HOST: xchain-smartgw
    ORCH_PORT: "4200"
  persistentVolume:
    enabled: true
    name: tractor-kpm-simu-pv
    claimName: tractor-kpm-simu-pvc
    hostPath: /home/lapdk/workspace/oai-v210/xChain/src/kpm-sim
  volumeMounts:
    kpisCsv:
      mountPath: /app/kpis.csv
      subPath: urllc_Teams.csv

tractor-orchestrator:
  enabled: false
  fullnameOverride: "tractor-orchestrator"
  nodeSelector:
    node-role: core
  image:
    tag: latest
  env:
    T: "32"

tractor-normalizer:
  enabled: false
  fullnameOverride: "tractor-normalizer"
  nodeSelector:
    node-role: core
  image:
    tag: latest
  persistentVolume:
    hostPath: /home/lapdk/workspace/oai-v210/xChain/src/xapp/models
  env:
    T: "32"

tractor-buffer:
  enabled: false
  fullnameOverride: "tractor-buffer"
  nodeSelector:
    node-role: core
  image:
    tag: latest

tractor-model:
  enabled: false
  fullnameOverride: "tractor-model"
  nodeSelector:
    node-role: core
  image:
    tag: latest
  persistentVolume:
    hostPath: /home/lapdk/workspace/oai-v210/xChain/src/xapp/models
  volumeMounts:
    model:
      subPath: model.32.cnn.pt

tractor-mono:
  enabled: true
  fullnameOverride: "tractor-mono"
  nodeSelector:
    node-role: core
  image:
    tag: latest
  persistentVolume:
    model:
      hostPath: /home/lapdk/workspace/oai-v210/xChain/src/xapp/models
    norm:
      hostPath: /home/lapdk/workspace/oai-v210/xChain/src/xapp/models
  env:
    T: "4"
    MODEL_PATH: /mnt/model/model.4.cnn.pt
    NORM_PATH:  /mnt/model/cols_maxmin.pkl
  volumeMounts:
    model:
      mountPath: /mnt/model
      subPath: ""    # empty = mount entire directory; all model.{T}.cnn.pt files accessible
    norm:
      mountPath: /mnt/norm
      subPath: ""    # norm files also in same hostPath dir, accessed via /mnt/model
  resultsPVC:
    claimName: ""
  agent:
    enabled: false
    env:
      TRACTOR_T: "4"
      TRACTOR_CLASS_NAMES: "eMBB,mMTC,URLLC,ctrl"
      TRACTOR_T_OPTIONS:    "4,8,16,32"
      TRACTOR_MODEL_PATH:   "/mnt/model/model.{T}.cnn.pt"

xchain-orchestrator:
  enabled: true
  fullnameOverride: "xchain-orchestrator"
  nodeSelector:
    node-role: core
  image:
    tag: latest
  env:
    TRACTOR_HOST:      tractor-mono
    TRACTOR_PORT:      "4300"
    FASTINFER_HOST:    xchain-fastinfer
    FASTINFER_PORT:    "4400"
    # Journal pipeline — set PREPROC_AGENT_HOST to enable URLLC routing to agent
    PREPROC_AGENT_HOST:  "tractor-mono"              # e.g. tractor-mono
    PREPROC_AGENT_PORT:  "4301"          # preprocessing agent TCP data port
    PREPROC_AGENT_HTTP:  "5100"          # preprocessing agent HTTP port
    FILTER_AGENT_HOST:   "xchain-unicorn"              # e.g. xchain-unicorn
    FILTER_AGENT_PORT:   "5101"          # filtering agent HTTP port
    CONTEXT_LABEL:       "urllc-embb"    # operator context pushed to filtering agent

xchain-smartgw:
  enabled: true
  fullnameOverride: "xchain-smartgw"
  nodeSelector:
    node-role: core
  image:
    tag: latest
  persistentVolume:
    hostPath: /home/lapdk/workspace/oai-v210/xChain/src/smartGW
    subPath: smartgw_0134.pkl
  env:
    ORCH_HOST:          xchain-orchestrator
    ORCH_PORT:          "5010"
    ORCH_POLL_INTERVAL: "30"
    

xchain-kcl:
  enabled: false
  fullnameOverride: "xchain-kcl"
  nodeSelector:
    node-role: core
  image:
    tag: latest
  env:
    LISTEN_PORT: "4500"
    MODELS_DIR: /models
    LABELING_MODEL: labeling_xapp.pth
    RESOURCE_MODEL: resource_xapp.pth
    LR_SCALER: lr_scaler.pkl
    NUM_UES: "5"
    T: "4"
    MODEL_TYPE: gnn
  persistentVolume:
    hostPath: /home/lapdk/workspace/oai-v210/xChain/src/kcl

xchain-fastinfer:
  enabled: true
  fullnameOverride: "xchain-fastinfer"
  nodeSelector:
    node-role: core
  image:
    tag: latest
  persistentVolume:
    hostPath: /home/lapdk/workspace/oai-v210/xChain/src/xapp-fastinfer
    subPath: xgb_model_T_4.json
  env:
    T: "4"
  resultsPVC:
    claimName: ""

# ── Journal pipeline (xChain + UNICORN via agents) ────────────────────────────

# Enable tractor-mono with preprocessing agent sidecar
# Overrides tractor-mono section above when journal pipeline is active
# tractor-mono:
#   enabled: true
#   agent:
#     enabled: true
#   resultsPVC:
#     claimName: ""   # no demo PVC needed

xchain-unicorn:
  enabled: false
  fullnameOverride: "xchain-unicorn"
  nodeSelector:
    node-role: core
  image:
    tag: latest
  persistentVolume:
    hostPath: /home/lapdk/workspace/oai-v210/xChain/src/xapp-unicorn/models
  env:
    MODEL_ARCH: ForwConvNet
    OOD_INDEX:  "5"
    SLICE_LEN:  "64"
  agent:
    enabled: true   # set to true to enable filtering agent sidecar
    env:
      CONTEXT_LABEL:         urllc-mmtc   # urllc-mmtc | urllc-embb
      DRIFT_DETECTOR:        ddm          # none | ddm | adwin | eddm | ph
      COMPLAINT_COOLDOWN:    "15"         # seconds between complaints
      COMPLAINT_ERROR_STREAK: "20"        # consecutive errors to re-complain after DDM reset
  resultsPVC:
    claimName: ""