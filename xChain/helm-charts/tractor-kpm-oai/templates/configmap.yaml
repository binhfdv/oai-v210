apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tractor-kpm-oai.fullname" . }}-config
data:
  metrics_config.py: |
    # Auto-generated by Helm
    {{- $mo := .Values.metricOrder }}
    {{- $lastIndex := sub (len $mo) 1 }}

    {{- range $typeName, $dm := dict "embb" .Values.defaultMetricsEmbb "mmtc" .Values.defaultMetricsMmtc "urllc" .Values.defaultMetricsUrllc }}
    _METRICS_{{ $typeName | upper }} = {
    {{- range $i, $k := $mo }}
        "{{ $k }}": {{ toJson (index $dm $k) }}{{ if ne $i $lastIndex }},{{ end }}
    {{- end }}
    }
    {{ end }}

    METRICS_BY_TYPE = {
        "embb":  _METRICS_EMBB,
        "mmtc":  _METRICS_MMTC,
        "urllc": _METRICS_URLLC,
    }

    # Fallback default (used when no experiment file is present)
    {{- $dm := .Values.defaultMetrics }}
    DEFAULT_METRICS = {
    {{- range $i, $k := $mo }}
        "{{ $k }}": {{ toJson (index $dm $k) }}{{ if ne $i $lastIndex }},{{ end }}
    {{- end }}
    }

    METRIC_ORDER = [
    {{- range $i, $k := $mo }}
        "{{ $k }}"{{ if ne $i $lastIndex }},{{ end }}
    {{- end }}
    ]