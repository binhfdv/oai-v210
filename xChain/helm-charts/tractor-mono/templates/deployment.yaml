apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tractor-mono.fullname" . }}
  labels:
    {{- include "tractor-mono.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "tractor-mono.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tractor-mono.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
{{ toYaml .Values.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
{{ toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      containers:
        # ── Main container ────────────────────────────────────────────────────
        - name: tractor-mono
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          # tee stdout to shared emptyDir so agent sidecar can tail it
          command: ["/bin/sh", "-c"]
          args: ["sleep 1 && python main.py 2>&1 | tee /model-logs/model.log"]
          env:
          {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: "{{ $value }}"
          {{- end }}
          ports:
          {{- range .Values.service }}
            - name: {{ .name }}
              containerPort: {{ .containerPort }}
          {{- end }}
          volumeMounts:
            - name: model
              mountPath: {{ .Values.volumeMounts.model.mountPath }}
              {{- if .Values.volumeMounts.model.subPath }}
              subPath: {{ .Values.volumeMounts.model.subPath }}
              {{- end }}
            - name: norm
              mountPath: {{ .Values.volumeMounts.norm.mountPath }}
              {{- if .Values.volumeMounts.norm.subPath }}
              subPath: {{ .Values.volumeMounts.norm.subPath }}
              {{- end }}
            - name: model-logs
              mountPath: /model-logs
          resources:
{{ toYaml .Values.resources | nindent 12 }}

        # ── Sidecar: universal agent (log_collector mode) ─────────────────────
        {{- if .Values.agent.enabled }}
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy | default "IfNotPresent" }}
          env:
          {{- range $key, $value := .Values.agent.env }}
            - name: {{ $key }}
              value: "{{ $value }}"
          {{- end }}
          volumeMounts:
            - name: model-logs
              mountPath: /model-logs
            {{- if .Values.resultsPVC.claimName }}
            - name: results
              mountPath: {{ .Values.resultsPVC.mountPath }}
            {{- end }}
        {{- end }}

      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: {{ .Values.persistentVolume.model.claimName }}
        - name: norm
          persistentVolumeClaim:
            claimName: {{ .Values.persistentVolume.norm.claimName }}
        - name: model-logs
          emptyDir: {}
        {{- if and .Values.agent.enabled .Values.resultsPVC.claimName }}
        - name: results
          persistentVolumeClaim:
            claimName: {{ .Values.resultsPVC.claimName }}
        {{- end }}
