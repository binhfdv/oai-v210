replicaCount: 1

image:
  repository: ddocker122/tractor-xapp-mono
  tag: dev
  pullPolicy: IfNotPresent

fullnameOverride: "tractor-mono"

serviceType: ClusterIP
service:
  - name: kpm-http
    containerPort: 4300
  - name: mono-http
    containerPort: 5000

serviceAccount:
  annotations: {}
  automount: true
  create: true
  name: ''

volumeMounts:
  model:
    mountPath: /mnt/model/model.pt
    subPath: model.16.cnn.pt
  norm:
    mountPath: /mnt/model/norm.pkl
    subPath: cols_maxmin.pkl

persistentVolume:
  model:
    enabled: true
    name: tractor-model-pv
    claimName: tractor-model-pvc
    size: 1Gi
    accessMode: ReadWriteMany
    hostPath: /home/lapdk/workspace/oai-v210/tractor/src/xapp/models
    reclaimPolicy: Delete
  norm:
    enabled: true
    name: tractor-normalizer-pv
    claimName: tractor-normalizer-pvc
    size: 1Gi
    accessMode: ReadWriteMany
    hostPath: /home/lapdk/workspace/oai-v210/tractor/src/xapp/models
    reclaimPolicy: Delete

env:
  MODEL_TYPE: CNN
  NCLASS: "4"
  ALL_FEATS: "31"
  STREAM_ID: default
  MODEL_PATH: /mnt/model/model.pt
  NORM_PATH: /mnt/model/norm.pkl
  T: "16"

# Universal agent sidecar
# journal pipeline (preprocessing mode): image = ddocker122/xchain-agent
# demo (log_collector mode):             image = ddocker122/universal-agent
agent:
  enabled: false
  image:
    repository: ddocker122/xchain-agent
    tag: latest
    pullPolicy: IfNotPresent
  env:
    AGENT_MODE:           preprocessing
    AGENT_PORT:           "5100"
    AGENT_DATA_PORT:      "4301"
    
    MODEL_HOST:           localhost
    MODEL_PORT:           "5000"
    PEER_AGENT_HOST:      xchain-unicorn
    PEER_AGENT_PORT:      "5101"
    TRACTOR_T:            "16"
    TRACTOR_CLASS_NAMES:  "eMBB,mMTC,URLLC,ctrl"
    TRACTOR_T_OPTIONS:    "4,8,16,32"
    TRACTOR_MODEL_PATH:   "/mnt/model/model.{T}.cnn.pt"
    TRACTOR_MODEL_TYPE:   "CNN"
    TRACTOR_NUM_FEATS:    "17"
    TRACTOR_NCLASS:       "4"
    ENHANCER_OUT_HOST:    "localhost"
    ENHANCER_OUT_PORT:    "4300"

# Shared results PVC (same PV/PVC as xchain-gui-server)
resultsPVC:
  claimName: demo-results-pvc
  mountPath: /results

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
