replicaCount: 1

image:
  repository: ddocker122/tractor-xapp-mono
  tag: dev
  pullPolicy: IfNotPresent

fullnameOverride: "tractor-mono-v1"

serviceType: ClusterIP
service:
  - name: kpm-http
    containerPort: 4300
  - name: mono-http
    containerPort: 5000

serviceAccount:
  annotations: {}
  automount: true
  create: true
  name: ''

volumeMounts:
  model:
    mountPath: /mnt/model/model.pt
    subPath: model.4.cnn.pt
  norm:
    mountPath: /mnt/model/norm.pkl
    subPath: cols_maxmin.pkl

persistentVolume:
  model:
    enabled: true
    name: tractor-mono-v1-model-pv
    claimName: tractor-mono-v1-model-pvc
    size: 1Gi
    accessMode: ReadWriteMany
    hostPath: /home/lapdk/workspace/oai-v210/tractor/src/xapp/models
    reclaimPolicy: Delete
  norm:
    enabled: true
    name: tractor-mono-v1-normalizer-pv
    claimName: tractor-mono-v1-normalizer-pvc
    size: 1Gi
    accessMode: ReadWriteMany
    hostPath: /home/lapdk/workspace/oai-v210/tractor/src/xapp/models
    reclaimPolicy: Delete

env:
  MODEL_TYPE: CNN
  NCLASS: "4"
  ALL_FEATS: "31"
  STREAM_ID: default
  MODEL_PATH: /mnt/model/model.pt
  NORM_PATH: /mnt/model/norm.pkl
  T: "4"

# Universal agent sidecar (log_collector mode)
agent:
  enabled: false
  image:
    repository: ddocker122/universal-agent
    tag: latest
    pullPolicy: IfNotPresent
  env:
    DEMO_SERVER_HOST: xchain-gui-server
    DEMO_SERVER_PORT: "4000"
    AGENT_MODE: log_collector
    MODEL_NAME: cnn-v1
    MODEL_TYPE: cnn
    LOG_FILE: /model-logs/model.log
    RESULTS_DIR: /results

# Shared results PVC (same PV/PVC as xchain-gui-server)
resultsPVC:
  claimName: demo-results-pvc
  mountPath: /results

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
