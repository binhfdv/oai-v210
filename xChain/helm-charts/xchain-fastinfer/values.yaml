replicaCount: 1

image:
  repository: ddocker122/xchain-fastinfer
  tag: latest
  pullPolicy: IfNotPresent

fullnameOverride: "xchain-fastinfer"

serviceAccount:
  create: true
  name: "xchain-fastinfer-sa"
  automount: true
  annotations: {}

serviceType: ClusterIP

service:
  - name: kpm-http
    containerPort: 4400
  - name: model-http
    containerPort: 5001

env:
  MODEL_PATH: /mnt/model/xgb_model.json
  XCHAIN_DATA_PORT: "4400"
  T: "4"

persistentVolume:
  enabled: true
  name: xchain-fastinfer-pv
  claimName: xchain-fastinfer-pvc
  size: 1Gi
  accessMode: ReadWriteMany
  mountPath: /mnt/model/xgb_model.json
  hostPath: /home/lapdk/workspace/oai-v210/tractor/src/xapp-fast
  reclaimPolicy: Delete
  subPath: xgb_model_T_4.json

# Universal agent sidecar (log_collector mode)
agent:
  enabled: false
  image:
    repository: ddocker122/universal-agent
    tag: latest
    pullPolicy: IfNotPresent
  env:
    DEMO_SERVER_HOST: xchain-gui-server
    DEMO_SERVER_PORT: "4000"
    AGENT_MODE: log_collector
    MODEL_NAME: fastinfer
    MODEL_TYPE: xgboost
    LOG_FILE: /model-logs/model.log
    RESULTS_DIR: /results

# Shared results PVC (same PV/PVC as xchain-gui-server)
resultsPVC:
  claimName: demo-results-pvc
  mountPath: /results

resources: {}
nodeSelector: {}
affinity: {}
tolerations: []
